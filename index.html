<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ARISE SYSTEM</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARISE" />
    <link rel="apple-touch-icon" href="/arise-icon.svg" />

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(console.warn);
        });
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Garet';
        src: url('/fonts/garet-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Garet';
        src: url('/fonts/garet-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Roboto Mono';
        src: url('/fonts/roboto-mono-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Roboto Mono';
        src: url('/fonts/roboto-mono-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              garet: ['Garet', 'sans-serif'],
              mono: ['"Roboto Mono"', 'monospace'],
              sans: ['Inter', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
            },
            colors: {
              system: {
                blue: 'rgb(var(--rank-rgb))',
                glow: 'rgb(var(--rank-rgb))',
                dark: '#020617',
                panel: '#0f172a',
                border: '#1e293b'
              },
              shadow: {
                purple: '#8b5cf6',
                dark: '#2e1065'
              }
            },
            animation: {
              'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'bounce-in': 'bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'fade-in': 'fade-in 0.4s ease-out forwards',
              'slide-up': 'slide-up 0.5s ease-out forwards',
              'slide-in-right': 'slide-in-right 0.4s ease-out forwards',
              'zoom-in': 'zoom-in 0.3s ease-out forwards',
            },
            keyframes: {
              'pulse-glow': {
                '0%, 100%': { opacity: 1, boxShadow: '0 0 10px #3b82f6' },
                '50%': { opacity: .5, boxShadow: '0 0 20px #60a5fa' },
              },
              'bounce-in': {
                '0%': { opacity: 0, transform: 'scale(0.8)' },
                '100%': { opacity: 1, transform: 'scale(1)' },
              },
              'fade-in': {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              },
              'slide-up': {
                '0%': { opacity: 0, transform: 'translateY(20px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              'slide-in-right': {
                '0%': { opacity: 0, transform: 'translateX(20px)' },
                '100%': { opacity: 1, transform: 'translateX(0)' },
              },
              'zoom-in': {
                '0%': { opacity: 0, transform: 'scale(0.9)' },
                '100%': { opacity: 1, transform: 'scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @property --rank-color {
        syntax: '<color>';
        inherits: true;
        initial-value: #9ca3af;
      }
      :root {
        --rank-color: #9ca3af;
        --rank-color-10: #9ca3af1a;
        --rank-color-30: #9ca3af4d;
        --rank-color-60: #9ca3af99;
        --rank-rgb: 156, 163, 175;
        transition: --rank-color 1s ease;
      }
      body {
        background-color: #020617;
        color: #e2e8f0;
      }
      /* Custom Scrollbar for the System look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--rank-color);
        transition: background 1s ease;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--rank-color);
        filter: brightness(1.3);
      }

      /* Star field animation */
      @keyframes animStar {
        from { transform: translateY(0px); }
        to   { transform: translateY(-2000px); }
      }

      /* Aurora background orbs */
      @keyframes aurora-drift-1 {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.13; }
        33%       { transform: translate(-4%, 6%) scale(1.08); opacity: 0.20; }
        66%       { transform: translate(3%, -3%) scale(0.95); opacity: 0.10; }
      }
      @keyframes aurora-drift-2 {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.09; }
        50%       { transform: translate(5%, 4%) scale(1.12); opacity: 0.15; }
      }
      @keyframes aurora-drift-3 {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.11; }
        40%       { transform: translate(-6%, -4%) scale(1.05); opacity: 0.17; }
        80%       { transform: translate(2%, 5%) scale(0.92); opacity: 0.07; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
